name: Preview

# Puts the work-in-progress site on a private workers.dev address so Marc can click around.
# It never changes ganders.nz or its DNS.
on:
  push:
    branches: [phase-1-core]
  workflow_dispatch:

permissions:
  contents: read

concurrency: preview

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:dashes
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:admin
      - name: Find or create the database, bucket and key store
        id: cf
        run: node scripts/provision.mjs
      - name: Update the database
        run: npx wrangler d1 migrations apply ganders-nz --remote -c wrangler.deploy.jsonc
      - name: Deploy
        run: npx wrangler deploy -c wrangler.deploy.jsonc
      - name: Set secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          HAS_APP_KEY: ${{ steps.cf.outputs.has_app_key }}
        run: |
          node -e '
            const crypto = require("node:crypto");
            const out = {};
            for (const k of ["RESEND_API_KEY", "OWNER_EMAIL", "ADMIN_PASSWORD"]) if (process.env[k]) out[k] = process.env[k];
            if (process.env.HAS_APP_KEY !== "yes") out.APP_KEY = crypto.randomBytes(32).toString("base64");
            require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(out));
          '
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json" -c wrangler.deploy.jsonc
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Check it answers
        if: steps.cf.outputs.url != ''
        run: |
          sleep 5
          curl -fsS -o /dev/null -w "Home page: %{http_code}\n" "${{ steps.cf.outputs.url }}/"
          echo "Preview: ${{ steps.cf.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
